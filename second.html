<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>艾奇诺 · 型号解析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <div class="grain"></div>

  <!-- 左侧可收起工具栏 -->
  <aside class="sidetool is-collapsed" id="sidetool">
    <button class="sidetool__toggle" id="sidetoolToggle" type="button" aria-label="展开工具栏" aria-expanded="false">
      <span class="sidetool__chevron">‹</span>
    </button>
    <div class="sidetool__body">
      <div class="sidetool__title">快捷导航</div>
      <nav class="sidetool__nav">
        <a class="sidetool__link" href="index.html">选型主页</a>
        <a class="sidetool__link is-current" href="second.html" aria-current="page">型号解析</a>
      </nav>
    </div>
  </aside>

  <header class="masthead">
    <div class="masthead__inner">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <img src="AN.png" alt="艾奇诺" />
        </div>
        <div class="brand__text">
          <h1>艾奇诺 · 型号解析工具</h1>
          <p>Model Parser</p>
        </div>
      </div>
      <div class="docno" aria-hidden="true">
        <span>SPEC-SELECTOR</span><i>/</i><span>AN-102/A6</span>
      </div>
    </div>
  </header>

  <main class="stage">
    <section class="card">
      <div class="card__badge">P</div>
      <div class="card__head">
        <h2>完整型号解析</h2>
        <p>输入完整的开关型号（如 AN-102-D-M12QD-0.5M(SE)），自动解析各项参数。</p>
      </div>
      <div class="parse-modes" id="parseModes">
        <button type="button" class="parse-mode is-active" data-mode="parse">型号解析</button>
        <button type="button" class="parse-mode" data-mode="reverse">客户型号反查</button>
      </div>
      <div class="series-search" id="parseSearch">
        <input id="parseInput" type="search" placeholder="输入完整型号，如 AN-102-D-M12QD-0.5M(SE)…" autocomplete="off" />
      </div>
      <div class="parse-hint" id="parseHint">输入型号后自动解析</div>
    </section>

    <section class="result" id="parseResult" hidden>
      <div class="result__head">
        <span class="result__title">解析结果</span>
        <span class="result__legend">PARSED</span>
      </div>
      <div class="result__model" id="parseModelOutput">—</div>
      <dl class="result__grid" id="parseGrid"></dl>
      <div class="customer-select" id="parseCustomer" hidden></div>
      <a class="result3d" id="parse3dLink" href="3d-viewer.html" target="_blank" rel="noopener" hidden>
        <div class="result3d__stage">
          <model-viewer id="parsePreviewMv" src="" auto-rotate rotation-per-second="25deg" environment-image="neutral" shadow-intensity="1" exposure="0.95" interaction-prompt="none" reveal="auto" style="background: transparent"></model-viewer>
          <span class="result3d__overlay" aria-hidden="true"></span>
          <span class="result3d__hint">点击查看 →</span>
        </div>
        <div class="result3d__text">
          <span class="result3d__title">三维数模</span>
          <span class="result3d__sub">点击进入可旋转 / 缩放查看</span>
        </div>
      </a>
      <div class="result3d--empty" id="parse3dEmpty" hidden>三维数模即将上线</div>
      <div class="result__actions">
        <a class="btn btn--download" id="parse3dDl" href="#" download hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          3D数模下载
        </a>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="models3d.js"></script>
  <script src="parser.js"></script>
  <script>
    /* 左侧工具栏收起/展开 */
    var sidetool = document.getElementById("sidetool");
    var sidetoolToggle = document.getElementById("sidetoolToggle");
    sidetoolToggle.addEventListener("click", function () {
      var collapsed = sidetool.classList.toggle("is-collapsed");
      sidetoolToggle.setAttribute("aria-expanded", String(!collapsed));
      sidetoolToggle.setAttribute("aria-label", collapsed ? "展开工具栏" : "收起工具栏");
    });

    /* ---------- 3D数模联动 ---------- */
    var parse3dLink = document.getElementById("parse3dLink");
    var parse3dEmpty = document.getElementById("parse3dEmpty");
    var parsePreviewMv = document.getElementById("parsePreviewMv");
    var parse3dDl = document.getElementById("parse3dDl");

    function switchBase(sm) {
      if (!sm) return null;
      return sm
        .replace(/-D$/, "")
        .replace(/-(S|N|P)$/, "")
        .replace(/(\d)(S|N|P)$/, "$1");
    }
    function find3D(base) {
      return (typeof MODELS_3D !== "undefined" ? MODELS_3D : []).find(function (m) { return m.base === base; }) || null;
    }
    function renderParse3D(r) {
      if (!r || !r.switchModel) {
        parse3dLink.hidden = true;
        parse3dEmpty.hidden = true;
        if (parsePreviewMv) parsePreviewMv.removeAttribute("src");
        if (parse3dDl) parse3dDl.hidden = true;
        return;
      }
      var base = switchBase(r.switchModel);
      var acc = r.accessory;
      var accSuffix = acc && acc !== "无（仅开关）" ? "-" + acc : "";
      var m = null;
      if (accSuffix) m = find3D(r.switchModel + accSuffix);
      if (!m && base) m = find3D(base);
      if (m && parsePreviewMv) {
        parse3dEmpty.hidden = true;
        parse3dLink.hidden = false;
        parse3dLink.href = "3d-viewer.html?m=" + encodeURIComponent(m.base);
        parsePreviewMv.setAttribute("src", m.file);
        if (parse3dDl) {
          parse3dDl.hidden = false;
          parse3dDl.href = m.stp;
          parse3dDl.download = m.base + ".stp";
        }
      } else {
        parse3dLink.hidden = true;
        parse3dEmpty.hidden = false;
        if (parsePreviewMv) parsePreviewMv.removeAttribute("src");
        if (parse3dDl) parse3dDl.hidden = true;
      }
    }

    /* ---------- 型号解析逻辑 ---------- */
    var parseInput = document.getElementById("parseInput");
    var parseHint = document.getElementById("parseHint");
    var parseResult = document.getElementById("parseResult");
    var parseModelOutput = document.getElementById("parseModelOutput");
    var parseGrid = document.getElementById("parseGrid");
    var parseCustomer = document.getElementById("parseCustomer");
    var parseModes = document.getElementById("parseModes");
    var parseMode = "parse"; // 'parse' | 'reverse'
    var debounceTimer = null;

    /* 重置为闲置提示 */
    function resetParseIdle() {
      parseResult.hidden = true;
      parseHint.textContent = "输入客户型号后自动反查";
      parseHint.className = "parse-hint";
      renderParse3D(null);
    }

    /* 客户型号反查：输入客户型号 → 显示对应我们型号 */
    function renderReverse() {
      var raw = parseInput.value.trim();
      if (!raw) { resetParseIdle(); return; }

      var ours = window.__findOurByCustomer(raw);
      if (!ours || !ours.length) {
        parseResult.hidden = true;
        parseHint.textContent = "未找到对应的我们型号，请检查客户型号是否正确";
        parseHint.className = "parse-hint parse-hint--error";
        renderParse3D(null);
        return;
      }

      parseHint.textContent = "已找到对应型号 ✓";
      parseHint.className = "parse-hint parse-hint--ok";
      parseResult.hidden = false;
      parseModelOutput.textContent = raw;

      var rows = [["客户型号", raw]];
      for (var i = 0; i < ours.length; i++) {
        rows.push(
          [ours[i].gen === "old" ? "对应标准型" : "对应增强型", ours[i].our]
        );
      }
      parseGrid.innerHTML = rows
        .map(function (row) {
          return '<div><dt>' + row[0] + '</dt><dd>' + row[1] + '</dd></div>';
        })
        .join("");

      // 反查模式下不再展示客户型号再映射
      parseCustomer.hidden = true;
      parseCustomer.innerHTML = "";

      // 尽力展示第一个匹配型号的三维数模
      var first = window.__parseModel(ours[0].our);
      renderParse3D(first && !first.error ? first : null);
    }

    function renderParse() {
      var raw = parseInput.value.trim();
      if (!raw) {
        parseResult.hidden = true;
        parseHint.textContent = parseMode === "reverse" ? "输入客户型号后自动反查" : "输入型号后自动解析";
        parseHint.className = "parse-hint";
        renderParse3D(null);
        return;
      }

      if (parseMode === "reverse") { renderReverse(); return; }

      var r = window.__parseModel(raw);
      if (r.error) {
        parseResult.hidden = true;
        parseHint.textContent = r.error;
        parseHint.className = "parse-hint parse-hint--error";
        renderParse3D(null);
        return;
      }

      parseHint.textContent = "解析成功 ✓";
      parseHint.className = "parse-hint parse-hint--ok";
      parseResult.hidden = false;

      var L = window.__parseLabels;
      parseModelOutput.textContent = r.fullModel;

      var rows = [
        ["开关型号", r.switchModel],
        ["版本", L.genLabel(r.generation)],
        ["接线方式", L.wiringLabel(r.wiring)],
        ["信号类型", L.signalLabel(r)],
        ["出线方式", L.wireMethodLabel(r)],
        ["接头材质", L.metalLabel(r)],
        ["安装附件", r.accessory],
        ["缸径范围", L.boreListLabel(r)],
        ["适用系列", L.seriesLabel(r)],
      ];
      parseGrid.innerHTML = rows
        .map(function (row) {
          return '<div><dt>' + row[0] + '</dt><dd>' + row[1] + '</dd></div>';
        })
        .join("");

      // 客户型号
      if (r.customerModels && r.customerModels.length) {
        parseCustomer.hidden = false;
        parseCustomer.innerHTML = '<span class="chip__tag">对应客户型号</span>';
        r.customerModels.forEach(function (c) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "cust-opt is-selected";
          b.textContent = c;
          b.style.cursor = "default";
          parseCustomer.appendChild(b);
        });
      } else {
        parseCustomer.hidden = true;
        parseCustomer.innerHTML = "";
      }
      renderParse3D(r);
    }

    parseInput.addEventListener("input", function () {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderParse, 200);
    });
    parseInput.addEventListener("search", renderParse);
    parseInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); renderParse(); }
    });

    /* 模式切换 */
    if (parseModes) {
      parseModes.querySelectorAll(".parse-mode").forEach(function (btn) {
        btn.addEventListener("click", function () {
          parseModes.querySelectorAll(".parse-mode").forEach(function (b) {
            b.classList.toggle("is-active", b === btn);
          });
          parseMode = btn.getAttribute("data-mode");
          parseInput.placeholder = parseMode === "reverse"
            ? "输入客户型号，如 DS1-69AG-M12QD-0.5M(SE)…"
            : "输入完整型号，如 AN-102-D-M12QD-0.5M(SE)…";
          parseHint.textContent = parseMode === "reverse" ? "输入客户型号后自动反查" : "输入型号后自动解析";
          parseHint.className = "parse-hint";
          renderParse();
        });
      });
    }
  </script>
</body>
</html>
