<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D数模 · 在线查看</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --chrome: #ffffff;
    --stage-1: #2a2c33;
    --stage-2: #131418;
    --text: #1f2330;
    --text-muted: #6b7280;
    --border: #e4e6eb;
    --accent: #4b3fe3;
    --accent-soft: #eee9ff;
    --radius: 10px;
    --shadow: 0 6px 22px rgba(20, 22, 34, 0.08);
    --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--sans);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 22px;
    background: var(--chrome);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #6f6fff, #4b3fe3);
    display: grid; place-items: center; color: #fff; font-weight: 700;
    font-size: 15px; letter-spacing: .5px;
  }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 650; }
  .brand p { margin: 0; font-size: 12px; color: var(--text-muted); }

  .ctrls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--chrome);
    color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
    transition: all .15s ease; white-space: nowrap;
  }
  .btn:hover { border-color: #c9ccd4; background: #fafafa; }
  .btn.on {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .btn.on:hover { background: #4334d6; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  #btnDownload { justify-content: center; text-align: center; }

  /* main stage */
  main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 14px; min-height: 0; }
  .stage {
    position: relative; flex: 1; min-height: 380px;
    border-radius: 16px; overflow: hidden;
    background: radial-gradient(120% 120% at 50% 25%, var(--stage-1), var(--stage-2));
    box-shadow: var(--shadow);
  }
  model-viewer {
    width: 100%; height: 100%; --poster-color: transparent;
    --progress-bar-color: #8b7dff; --progress-mask: transparent;
  }
  .hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: rgba(255,255,255,.55); font-size: 12px; pointer-events: none;
    background: rgba(0,0,0,.28); padding: 5px 14px; border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  .badge-name {
    position: absolute; top: 14px; left: 16px;
    color: #fff; font-size: 13px; font-weight: 600;
    background: rgba(0,0,0,.32); padding: 6px 12px; border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  /* progress bar slot */
  .progress {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: rgba(255,255,255,.08); display: none;
  }
  .progress-bar { height: 100%; width: 0%; background: #8b7dff; transition: width .2s; }

  /* model rail */
  .rail { display: flex; gap: 10px; overflow-x: auto; padding: 2px; }
  .card {
    flex: 0 0 auto; width: 168px; padding: 12px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--chrome); cursor: pointer;
    transition: all .15s ease;
  }
  .card:hover { border-color: #c9ccd4; transform: translateY(-1px); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .card .name { font-weight: 600; font-size: 14px; margin: 0 0 2px; }
  .card .file { font-size: 11px; color: var(--text-muted); word-break: break-all; }
  .card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; margin-right: 6px; vertical-align: middle; }
  .card.empty .dot { background: #d1d5db; }

  footer { text-align: center; color: var(--text-muted); font-size: 12px; padding: 10px; }
  .empty-state {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: rgba(255,255,255,.6); text-align: center; padding: 20px;
  }
  @media (max-width: 640px) {
    .brand p { display: none; }
    .stage { min-height: 300px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">3D</div>
    <div>
      <h1>三维数模在线查看</h1>
      <p>拖动旋转 · 滚轮缩放 · 右键/双指平移</p>
    </div>
  </div>
  <div class="ctrls">
    <a class="btn" id="btnDownload" href="#" download title="下载数模文件" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      3D数模下载
    </a>
    <button class="btn" id="btnRotate" title="自动旋转">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
      自动旋转
    </button>
    <button class="btn" id="btnReset" title="复位视角">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>
      复位
    </button>
    <button class="btn" id="btnFull" title="全屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      全屏
    </button>
  </div>
</header>

<main>
  <div class="stage" id="stage">
    <model-viewer
      id="mv"
      src=""
      alt="三维数模"
      camera-controls
      auto-rotate
      auto-rotate-delay="2000"
      rotation-per-second="20deg"
      camera-orbit="45deg 75deg 105%"
      min-field-of-view="10deg"
      max-field-of-view="45deg"
      min-camera-orbit="auto auto 10%"
      interaction-prompt="auto"
      exposure="0.95"
      shadow-intensity="1"
      environment-image="neutral"
      reveal="auto"
      style="background: transparent">
      <div class="progress" slot="progress-bar"><div class="progress-bar"></div></div>
    </model-viewer>
    <div class="badge-name" id="badgeName">—</div>
    <div class="hint">左键旋转 · 右键拖动平移 · 滚轮缩放</div>
  </div>

  <div class="rail" id="rail"></div>
</main>

<footer></footer>

<script src="models3d.js"></script>
<script>
  const mv = document.getElementById('mv');
  const rail = document.getElementById('rail');
  const badge = document.getElementById('badgeName');
  const stage = document.getElementById('stage');
  const btnRotate = document.getElementById('btnRotate');
  const btnReset = document.getElementById('btnReset');
  const btnFull = document.getElementById('btnFull');
  const btnDownload = document.getElementById('btnDownload');
  const prog = stage.querySelector('.progress');
  const progBar = stage.querySelector('.progress-bar');

  function loadModel(idx) {
    const m = MODELS_3D[idx];
    if (!m) return;
    mv.src = encodeURI(m.file);
    mv.alt = m.name + " 3D模型";
    badge.textContent = m.name;
    if (btnDownload && m.stp) {
      btnDownload.href = encodeURI(m.stp);
      btnDownload.download = m.base + ".stp";
      btnDownload.style.display = '';
    } else if (btnDownload) {
      btnDownload.style.display = 'none';
    }
    [...rail.children].forEach((c, i) => c.classList.toggle('active', i === idx));
    prog.style.display = 'block'; progBar.style.width = '0%';
  }

  let modelCenter = null;
  function rememberCenter(remaining) {
    const t = mv.cameraTarget;
    if (t && t.trim()) modelCenter = t;
    if (remaining > 0) requestAnimationFrame(() => rememberCenter(remaining - 1));
  }
  mv.addEventListener('progress', (e) => {
    const t = e.detail?.totalProgress;
    if (typeof t === 'number') progBar.style.width = (t * 100) + '%';
  });
  mv.addEventListener('load', () => {
    prog.style.display = 'none';
    modelCenter = null;
    rememberCenter(8);
  });
  mv.addEventListener('error', () => {
    prog.style.display = 'none';
    badge.textContent = '加载失败';
  });

  // build rail
  const params = new URLSearchParams(location.search);
  const singleOnly = params.get('single') === '1';   // 限定只查看选中型号
  if (singleOnly) {
    // 锁定：只加载 ?m= 指定型号，隐藏切换栏
    const theM = MODELS_3D.find((m) => m.base === params.get('m')) || MODELS_3D[0];
    if (theM) loadModel(MODELS_3D.indexOf(theM));
    document.querySelector('.rail').style.display = 'none';
  } else if (MODELS_3D.length === 0) {
    rail.innerHTML = '<div class="card empty"><span class="dot"></span><div class="name">暂无模型</div><div class="file">将 .glb 放入 3D 目录后在 models3d.js 中登记</div></div>';
  } else {
    MODELS_3D.forEach((m, i) => {
      const c = document.createElement('div');
      c.className = 'card' + (i === 0 ? ' active' : '');
      c.innerHTML = `<span class="dot"></span><div class="name">${m.name}</div><div class="file">${m.file}</div>`;
      c.addEventListener('click', () => loadModel(i));
      rail.appendChild(c);
    });
    const paramM = params.get('m');
    let startIdx = 0;
    if (paramM) {
      const found = MODELS_3D.findIndex((m) => m.base === paramM);
      if (found >= 0) startIdx = found;
    }
    loadModel(startIdx);
  }

  // auto-rotate toggle
  let rotating = true;
  btnRotate.classList.add('on');
  btnRotate.addEventListener('click', () => {
    rotating = !rotating;
    mv.autoRotate = rotating;
    btnRotate.classList.toggle('on', rotating);
  });

  // reset view
  btnReset.addEventListener('click', () => {
    mv.cameraOrbit = '45deg 75deg 105%';
    if (modelCenter) mv.cameraTarget = modelCenter;
    mv.jumpCameraToGoal();
  });

  // fullscreen
  btnFull.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else stage.requestFullscreen?.();
  });
</script>
</body>
</html>
