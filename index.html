<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>气缸开关型号选型助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain"></div>

  <header class="masthead">
    <div class="masthead__inner">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <rect x="4" y="6" width="40" height="24" rx="3" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="44" cy="18" r="6" fill="currentColor"/>
            <rect x="10" y="17" width="22" height="2" fill="currentColor"/>
            <rect x="10" y="22" width="14" height="2" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 24h40"/>
              <path d="M14 34v4M24 34v4M34 34v4"/>
            </g>
          </svg>
        </div>
        <div class="brand__text">
          <h1>气缸开关型号选型助手</h1>
          <p>Cylinder Switch Model Selector</p>
        </div>
      </div>
      <div class="docno" aria-hidden="true">
        <span>SPEC-SELECTOR</span><i>/</i><span>AN-103/A6</span>
      </div>
    </div>
  </header>

  <main class="stage">
    <!-- 进度条 -->
    <nav class="steps" aria-label="选型进度">
      <ol class="steps__track" id="stepTrack"></ol>
    </nav>

    <!-- 已选参数标签 -->
    <section class="picked" id="pickedBar" aria-label="已选参数"></section>

    <!-- 分步向导 -->
    <section class="card">
      <div class="card__badge" id="stepBadge">01</div>
      <div class="card__head">
        <h2 id="stepTitle">选择气缸系列</h2>
        <p id="stepDesc">请选择需要的气缸系列，不同系列对应不同的缸径范围与开关型号。</p>
      </div>
      <div class="options" id="optionsArea"></div>
      <div class="card__foot">
        <button class="btn btn--ghost" id="btnBack" type="button">← 上一步</button>
        <button class="btn btn--primary" id="btnNext" type="button" disabled>下一步 →</button>
      </div>
    </section>

    <!-- 结果面板 -->
    <section class="result" id="resultPanel" hidden>
      <div class="result__head">
        <span class="result__title">选型结果</span>
        <span class="result__legend">RESULT</span>
      </div>
      <div class="result__model" id="modelOutput">—</div>
      <dl class="result__grid" id="resultGrid"></dl>
      <div class="result__actions">
        <button class="btn btn--primary" id="btnCopy" type="button">复制完整型号</button>
        <button class="btn btn--ghost" id="btnRestart" type="button">重新选型</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>数据源自 · 气缸系列-开关型号对照表</span>
    <span>仅供选型参考</span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
