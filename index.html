<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>艾奇诺抗强磁开关对标亚德客选型助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- 百度统计 -->
  <script>
    var _hmt = _hmt || [];
    (function () {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?56a01ec9cddf16c643e8af8f73b5bf3c";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
  </script>
</head>
<body>
  <div class="grain"></div>

  <!-- 左侧可收起工具栏（固定在位，滚动时跟随屏幕） -->
  <aside class="sidetool" id="sidetool">
    <button class="sidetool__toggle" id="sidetoolToggle" type="button" aria-label="收起工具栏" aria-expanded="true">
      <span class="sidetool__chevron">‹</span>
    </button>
    <div class="sidetool__body">
      <div class="sidetool__title">快捷导航</div>
      <nav class="sidetool__nav">
        <a class="sidetool__link is-current" href="index.html" aria-current="page">选型主页</a>
        <a class="sidetool__link" href="second.html">型号解析</a>
      </nav>
    </div>
  </aside>

  <header class="masthead">
    <div class="masthead__inner">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <img src="AN.png" alt="艾奇诺" />
        </div>
        <div class="brand__text">
          <h1>艾奇诺抗强磁开关对标亚德客选型</h1>
          <p>Cylinder Switch Model Selector</p>
        </div>
      </div>
      <div class="docno" aria-hidden="true">
        <span>SPEC-SELECTOR</span><i>/</i><span>AN-102/A6</span>
      </div>
    </div>
  </header>

  <main class="stage">
    <!-- 进度条 -->
    <nav class="steps" aria-label="选型进度">
      <ol class="steps__track" id="stepTrack"></ol>
    </nav>

    <!-- 已选参数标签 -->
    <section class="picked" id="pickedBar" aria-label="已选参数"></section>

    <!-- 分步向导 -->
    <section class="card">
      <div class="card__badge" id="stepBadge">01</div>
      <div class="card__head">
        <h2 id="stepTitle">选择气缸系列</h2>
        <p id="stepDesc">请选择需要的气缸系列，不同系列对应不同的缸径范围与开关型号。</p>
      </div>
      <!-- 系列搜索框 -->
      <div class="series-search hidden" id="seriesSearch">
        <input id="seriesSearchInput" type="search" placeholder="搜索气缸系列…" autocomplete="off" />
      </div>
      <div class="options" id="optionsArea"></div>
      <div class="card__foot">
        <span class="foot__hint">点选选项即进入下一步</span>
        <button class="btn btn--ghost" id="btnBack" type="button">← 上一步</button>
      </div>
    </section>

    <!-- 结果面板 -->
    <section class="result" id="resultPanel" hidden>
      <div class="result__head">
        <span class="result__title">选型结果</span>
        <span class="result__legend">RESULT</span>
      </div>
      <div class="result__model" id="modelOutput">—</div>
      <dl class="result__grid" id="resultGrid"></dl>
      <div class="customer-select" id="customerSelect" hidden></div>
      <div class="result__actions">
        <button class="btn btn--primary" id="btnCopy" type="button">复制完整型号</button>
        <button class="btn btn--ghost" id="btnRestart" type="button">重新选型</button>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    /* 左侧工具栏收起/展开 */
    var sidetool = document.getElementById("sidetool");
    var sidetoolToggle = document.getElementById("sidetoolToggle");
    sidetoolToggle.addEventListener("click", function () {
      var collapsed = sidetool.classList.toggle("is-collapsed");
      sidetoolToggle.setAttribute("aria-expanded", String(!collapsed));
    });
  </script>
</body>
</html>
